# MMC Reports — its own Netlify site (reports.movemountains.co).
# Site settings from the repository root:
#   base = reports
#   publish = reports/public
#   functions = reports/netlify/functions
# Do not attach this folder to the department dashboard site.

[build]
  base = "reports"
  publish = "reports/public"
  functions = "reports/netlify/functions"
  command = "echo 'Static site — no build step required.'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/*.json"]

[dev]
  port = 8888
  publish = "public"
  autoLaunch = false
  framework = "#static"

# API first, so the app shell never swallows /api.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://accounts.google.com; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
